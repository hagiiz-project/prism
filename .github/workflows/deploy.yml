name: build and deploy

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 20 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: bunkai
        run: python3 run.py decompose --in data/listings.csv --out data/materials.csv

      - name: coverage
        run: python3 run.py coverage --in data/listings.csv

      - name: build
        env:
          AMAZON_TAG: ${{ secrets.AMAZON_TAG }}
          RAKUTEN_ID: ${{ secrets.RAKUTEN_ID }}
          RAKUTEN_TRAVEL_ID: ${{ secrets.RAKUTEN_TRAVEL_ID }}
          JALAN_ID: ${{ secrets.JALAN_ID }}
        run: python3 site/build.py --listings data/listings.csv --materials data/materials.csv --out _site/index.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
