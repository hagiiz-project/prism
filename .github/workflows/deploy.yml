name: build and deploy

on:
  push:
    branches: [main]          # CSVを直せば、そのたびに公開まで自動で進む
  schedule:
    - cron: "0 20 * * *"      # 毎日 UTC20:00 = 日本時間 朝5時
  workflow_dispatch:          # Actions画面のボタンから手動実行もできる

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 設定の確認（値は表示されません）
        env:
          SHEET_ID: ${{ secrets.SHEET_ID }}
          AI_ENDPOINT: ${{ secrets.AI_ENDPOINT }}
          CONTACT_EMAIL: ${{ secrets.CONTACT_EMAIL }}
          AMAZON_TAG: ${{ secrets.AMAZON_TAG }}
        run: |
          chk() { if [ -n "$2" ]; then echo "  OK   $1"; else echo "  未設定 $1"; fi }
          echo "登録されているSecrets:"
          chk SHEET_ID      "$SHEET_ID"
          chk AI_ENDPOINT   "$AI_ENDPOINT"
          chk CONTACT_EMAIL "$CONTACT_EMAIL"
          chk AMAZON_TAG    "$AMAZON_TAG"

      - name: スプレッドシートから取り込む
        env:
          SHEET_ID: ${{ secrets.SHEET_ID }}
        run: python3 run.py sync --out data/listings.csv

      - name: 物品分解
        run: python3 run.py decompose --in data/listings.csv --out data/materials.csv

      - name: 網羅の穴を確認
        run: python3 run.py coverage --in data/listings.csv

      - name: サイトを組み立てる
        env:
          AMAZON_TAG: ${{ secrets.AMAZON_TAG }}
          RAKUTEN_ID: ${{ secrets.RAKUTEN_ID }}
          RAKUTEN_TRAVEL_ID: ${{ secrets.RAKUTEN_TRAVEL_ID }}
          JALAN_ID: ${{ secrets.JALAN_ID }}
          AI_ENDPOINT: ${{ secrets.AI_ENDPOINT }}
          CONTACT_EMAIL: ${{ secrets.CONTACT_EMAIL }}
        run: python3 site/build.py --listings data/listings.csv --materials data/materials.csv --out _site/index.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
