<script>
const DB = __PRISM_DATA__;

const SPEC={"宇宙・天文":"#3b5bff","生きもの・生命科学":"#00b36b","医療・健康・人体":"#ff4d8d",
 "地球・自然・防災":"#ff6b2c","物理・化学・材料":"#8b5cf6","工学・ものづくり":"#f5b700",
 "情報・数理・AI":"#00c2cc","環境・気候・エネルギー":"#5dd62c"};
const RAINBOW="linear-gradient(115deg,#3b5bff,#8b5cf6,#ff4d8d,#ff6b2c,#f5b700,#5dd62c,#00c2cc)";
const VERB={"みる・きく":{c:"#3b5bff",d:"動画・アプリ・VR",lead:"画面の前で完結します。準備がいらないぶん、いつでも始められます。"},
 "つかう":{c:"#ff6b2c",d:"キット・器具・模型・ゲーム",lead:"手元に物が残ります。買う判断が要りますが、何年も使えます。"},
 "よむ":{c:"#8b5cf6",d:"書籍・図鑑",lead:"一人で読み進められます。渡してそのまま持ち帰ってもらえます。"},
 "やってみる":{c:"#00b36b",d:"ワークショップ・観察会・ショー",lead:"参加する人がいて、その場で起きます。日程と場所の調整が要ります。"},
 "よぶ・あう":{c:"#ff4d8d",d:"出張授業・講演・あの人を呼ぶ",lead:"人を呼びます。相談から始まり、断られることもあります。"},
 "いく":{c:"#00a3ad",d:"科学館・施設・展示",lead:"こちらが出かけます。移動の時間と引率の人手を先に見積もってください。"}};
const RX=[{k:"hee",l:"へぇ！",c:"var(--r-hee)"},{k:"waku",l:"ワクワク",c:"var(--r-waku)"},
 {k:"fumu",l:"ふむふむ",c:"var(--r-fumu)"},{k:"suki",l:"すき",c:"var(--r-suki)"},
 {k:"yatte",l:"やってみたい",c:"var(--r-yatte)"}];
const RXBASE={},MYRX={};
function seedRx(){DB.items.forEach(i=>{RXBASE[i.id]={};RX.forEach((r,n)=>{
 const x=(i.id*(37+n*17)+n*101)%211;RXBASE[i.id][r.k]=Math.floor(x*x%97/3)+1;});});}
function rxCount(id,k){return (RXBASE[id]&&RXBASE[id][k]||0)+((MYRX[id]&&MYRX[id][k])?1:0)}
function toggleRx(ev,id,k){ev.stopPropagation();MYRX[id]=MYRX[id]||{};MYRX[id][k]=!MYRX[id][k];render()}
function rxBar(id,big){return `<div class="rx ${big?"rx-lg":""}">${RX.map(r=>{
 const on=!!(MYRX[id]&&MYRX[id][r.k]);
 return `<button class="rxb" aria-pressed="${on}" style="${on?`background:${r.c};border-color:${r.c}`:""}"
  onclick="toggleRx(event,${id},'${r.k}')"><span class="d" style="background:${r.c}"></span>${r.l}<span class="c">${rxCount(id,r.k)}</span></button>`}).join("")}</div>`}

const PACKS=[
 {key:"bousai",tag:"9月1日 防災の日",title:"15分の訓練枠を、体験でうめる",color:"#ff6b2c",
  lead:"地区訓練の座学のあいだに15分だけ、体を動かす時間を入れたい。そのための一式です。",

 return `<div class="wrap" style="padding-top:22px">
 <button class="back" onclick="openHub('rescue','')">← 時間がない人へ</button>
 <div class="hubhead" style="background:${p.color}"><h1>${p.title}</h1><p>${p.lead}</p></div>
 <div class="howto"><h3>この一式に入っているもの</h3><ul>${p.inside.map(x=>`<li>${x}</li>`).join("")}</ul>
  <div class="warn">${p.ev}</div></div>
 ${shopList(list)}
 <div class="toolbar" style="margin-top:22px"><span class="cnt">${list.length}<span>件</span></span>${sortSel()}</div>
 <div class="grid">${list.map(card).join("")}</div></div>`}

 const i=it(curId);
 const main={"無料":"見に行く","購入（買い切り）":"買えるところへ","予約（日時指定）":"日時を見て予約する",
  "要見積もり":"相談・依頼する","サブスク":"申し込む","フリーミアム":"試してみる"}[i.txn]||"見に行く";
 return `<div class="wrap" style="padding-top:22px;max-width:880px">
 <button class="back" onclick="go('list')">← 一覧にもどる</button>
 <div class="calm"><div class="band" style="${th(i)}"></div>
  <p class="hint" style="margin-top:14px">${i.fmt}｜${i.field||"分野をまたぐもの"}${i.since?"｜"+i.since+"年から":""}</p>
  <div style="display:flex;gap:14px;align-items:flex-start">
   <span class="favbig">${fav(i.url,28)}</span>
   <span><h1 style="font-size:27px;font-weight:900">${esc(i.title)}</h1>
   <p style="color:var(--ink3);font-size:13px;margin:5px 0 0;font-weight:600">${esc(i.provider)}
    <span class="tag">${i.ptype}</span><span class="tag">${host(i.url)}</span></p></span></div>
  <p style="color:var(--ink2);margin-top:12px">${esc(i.desc)}</p>
  <p style="font-size:22px;font-weight:900;margin-top:14px">${money(i)}</p>
  <div>${i.topics.map(t=>`<span class="tag">${esc(t)}</span>`).join("")}</div>
  <div class="cta-row"><a class="btn" target="_blank" rel="noopener" href="${i.url}">${main}</a></div></div>
 ${matBlock(i)}
 <section><div class="sec-hd" style="margin-bottom:6px"><h2 style="font-size:19px">この掲載への反応</h2>
   <span class="sub">優劣ではなく、どんな出会い方をされたか</span></div>${rxBar(i.id,true)}</section>
 <section><div class="sec-hd" style="margin-bottom:6px"><h2 style="font-size:19px">2つの情報を、分けて表示しています</h2></div>
  <p class="hint">①は提供者が示した条件、②はプリズム上で実際に起きたことです。①が②に書き換えられることはありません。</p>
  <div class="box box-claim"><span class="bt">① 提供者が示している条件</span>
   <ul><li>対象：${i.audience.join("・")||"記載なし"}</li><li>規模：${i.scale||"記載なし"}／レベル：${i.level||"記載なし"}</li>
    <li>目的：${i.purpose.join("・")||"記載なし"}</li><li>申し込み：${i.txn}</li></ul></div>
  <div class="box box-empty"><span class="bt">② プリズムに登録された実施</span>
   <p style="margin:0">実施記録は、まだありません。</p>
   <p style="margin:8px 0 0;font-size:12.5px">記録の投稿にはサーバー側の仕組みが必要です（未実装）。</p></div>
 </section>
 <section><div class="sec-hd"><h2 style="font-size:19px">同じ種類の届け手から</h2></div>
  <div class="grid" style="grid-template-columns:repeat(2,1fr)">${DB.items.filter(x=>x.ptype===i.ptype&&x.id!==i.id).slice(0,4).map(card).join("")}</div></section>
 </div>`}

function viewPublish(){return `<div class="wrap" style="padding-top:22px;max-width:900px">
 <button class="back" onclick="go('home')">← ホーム</button>
 <h1 style="font-size:32px;font-weight:900">掲載する</h1>
 <p class="hint">3つの経路。書ける範囲がそれぞれ違います。</p>
 <div class="tiles" style="margin-top:16px">${POSTS.map(p=>`<button class="tile" style="background:${p.color}" onclick="openHub('post','${p.key}')">
  <span class="n">${p.n}</span><b style="font-size:19px">${p.title}</b><span>${p.who}</span></button>`).join("")}</div></div>`}

function render(){const V={home:viewHome,list:viewList,detail:viewDetail,publish:viewPublish,hub:viewHub};
 document.getElementById("app").innerHTML=V[view]()}
seedRx();render();
</script></body></html>
